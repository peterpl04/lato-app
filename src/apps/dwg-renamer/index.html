<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <title>Renomeador DWG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <h1 class="titulo">DWG Renamer</h1>

    <div class="card">
      <button id="btnOrigem">Selecionar pasta de ORIGEM</button>
      <div class="path" id="origemPath"></div>
    </div>

    <div class="card">
      <button id="btnDestino">Selecionar pasta de DESTINO</button>
      <div class="path" id="destinoPath"></div>
    </div>

    <label>
      Multiplicador
      <span class="tooltip">
        <i class="fas fa-question-circle help-icon"></i>
        <span class="tooltip-text">
          O multiplicador é a quantidade de vezes que você deseja alterar para o número de alimentadores.
        </span>
      </span>

        <input class="espaco" type="number" id="multiplicador" placeholder="Informe o multiplicador" min="1" />
    </div>

    <div class="card">
      <label class="checkbox">
        <input type="checkbox" id="deleteOrigem" />
        <span class="checkmark"></span>
        Excluir arquivos da pasta de origem após concluir
      </label>
    </div>


    <div class="card">
      <button id="btnProcessar">Processar arquivos</button>
      <div class="status" id="status"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>

</html>
