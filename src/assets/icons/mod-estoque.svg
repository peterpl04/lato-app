<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgEstoque" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="boxBot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bgEstoque)"/>
  <rect x="0" y="0" width="128" height="128" rx="28" fill="white" opacity="0.06"/>

  <!-- Caixa superior -->
  <rect x="46" y="30" width="36" height="30" rx="4" fill="url(#boxTop)"/>
  <rect x="46" y="30" width="36" height="8" rx="4" fill="#b45309" opacity="0.85"/>
  <rect x="62" y="30" width="4" height="30" fill="#b45309" opacity="0.35"/>

  <!-- Caixa inferior esquerda -->
  <rect x="26" y="64" width="36" height="34" rx="4" fill="url(#boxBot)"/>
  <rect x="26" y="64" width="36" height="8" rx="4" fill="#b45309" opacity="0.85"/>
  <rect x="42" y="64" width="4" height="34" fill="#b45309" opacity="0.35"/>

  <!-- Caixa inferior direita -->
  <rect x="66" y="64" width="36" height="34" rx="4" fill="url(#boxBot)"/>
  <rect x="66" y="64" width="36" height="8" rx="4" fill="#b45309" opacity="0.85"/>
  <rect x="82" y="64" width="4" height="34" fill="#b45309" opacity="0.35"/>

  <!-- Base sombreada -->
  <rect x="22" y="99" width="84" height="4" rx="2" fill="#78350f" opacity="0.35"/>

  <!-- Brilho superior -->
  <path d="M14 14 Q30 6 60 8 L60 14 Q30 12 14 22 Z" fill="white" opacity="0.18"/>
