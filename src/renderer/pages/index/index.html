<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <title>LatoApps</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="launcher" aria-label="Launcher de aplicativos">
    <div class="bg-shape bg-shape-a"></div>
    <div class="bg-shape bg-shape-b"></div>

    <header class="topbar">
      <div class="brand-wrap">
        <img src="../../../assets/icons/logo.png" class="logo" alt="Lato Tecnologia" />
        <div>
          <h1>Sistema Lato</h1>
          <p>Central de módulos</p>
        </div>
      </div>
      <div class="context-chips" aria-label="Contexto do sistema">
        <span class="chip" id="ctx-user">Usuário: Operador</span>
        <span class="chip" id="ctx-env">Ambiente: Produção</span>
        <span class="chip status-badge info" id="ctx-update-status">Verificando...</span>
        <span class="chip" id="ctx-sync">Sync: agora</span>
        <span class="chip" id="ctx-version">v1.0.0</span>
      </div>
    </header>

    <div class="content-grid">
      <section class="main-column" aria-label="Area principal">
        <section class="favorites" aria-label="Filtros de exibição">
          <h2>Navegação</h2>
          <div class="favorites-list">
            <button class="favorite-chip is-active" data-filter="all" type="button">Todos</button>
            <button class="favorite-chip" data-filter="favorites" type="button">Favoritos</button>
            <button class="favorite-chip" data-filter="recent" type="button">Recentes</button>
          </div>
        </section>

        <section class="apps" aria-label="Aplicativos disponiveis">
          <button class="app-card" data-app="dwg" data-favorite="true" type="button" aria-label="Abrir DWG Renamer" data-keywords="dwg renamer arquivo lote renomeacao">
            <div class="app-icon">
              <img src="../../../assets/icons/dwg-renamer.svg" alt="">
            </div>
            <div class="app-name-row">
              <div class="app-name">DWG Renamer</div>
            </div>
          </button>

          <button class="app-card" data-app="pm" data-favorite="true" type="button" aria-label="Abrir Project Manager" data-keywords="project manager projetos progresso entregas dashboard">
            <div class="app-icon">
              <img src="../../../assets/icons/project-manager.svg" alt="">
            </div>
            <div class="app-name-row">
              <div class="app-name">Project Manager</div>
            </div>
          </button>

          <button class="app-card" data-app="fiscal" data-favorite="false" type="button" aria-label="Abrir Fiscal" data-keywords="fiscal nota fiscal busca arquivo pasta">
            <div class="app-icon">
              <img src="../../../assets/icons/fiscal.svg" alt="">
            </div>
            <div class="app-name-row">
              <div class="app-name">FISCAL</div>
            </div>
          </button>
        </section>

      </section>

      <aside class="activity" id="activity-card" aria-label="Atividade do sistema" role="button" tabindex="0">
        <div class="section-title">
          <h2>Atividade <span class="activity-count" id="activity-count">0</span></h2>
          <button id="activity-clear-btn" class="activity-clear-btn" type="button" title="Limpar notificações do card" aria-label="Limpar notificações do card">🗑</button>
        </div>
        <ul class="activity-list" id="activity-list"></ul>
        <div class="activity-insights" aria-label="Resumo da atividade">
          <div class="insight-chip">
            <span class="insight-label">Hoje</span>
            <strong class="insight-value" id="activity-today-count">0 eventos</strong>
          </div>
          <div class="insight-chip">
            <span class="insight-label">Último evento</span>
            <strong class="insight-value" id="activity-last-time">--:--</strong>
          </div>
          <div class="insight-chip">
            <span class="insight-label">Último módulo</span>
            <strong class="insight-value" id="activity-last-module">-</strong>
          </div>
        </div>
        <div class="activity-recent" aria-label="Módulos recentes">
          <h3>Recentes</h3>
          <ul class="activity-recent-list" id="activity-recent-list"></ul>
        </div>
        <p class="activity-hint">Clique para ver todas do dia</p>
      </aside>
    </div>
  </main>

  <div class="modal-backdrop is-hidden" id="activity-modal" aria-hidden="true">
    <div class="activity-modal" role="dialog" aria-modal="true" aria-labelledby="activity-modal-title">
      <div class="activity-modal-head">
        <div>
          <h3 id="activity-modal-title">Atividades do dia</h3>
          <p id="activity-modal-subtitle">Eventos registrados hoje</p>
        </div>
        <button class="activity-modal-close" id="activity-modal-close" type="button" aria-label="Fechar">Fechar</button>
      </div>

      <ul class="activity-day-list" id="activity-day-list"></ul>
    </div>
  </div>

  <div class="hover-tooltip" id="hoverTooltip" aria-hidden="true"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="renderer.js"></script>
</body>

</html>
