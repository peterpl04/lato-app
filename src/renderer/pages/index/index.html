<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <title>LatoApps</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"
</head>

<body>
  <div class="launcher">

    <!-- 🔝 HEADER -->
    <div class="header">
      <img src="../../../assets/icons/logo.png" class="logo" alt="Lato Tecnologia" />
    </div>

    <!-- 📦 APPS -->
    <div class="apps">
      <div class="app-card" onclick="openDWG()">
        <div class="app-icon">
          <img src="../../../assets/icons/dwg-renamer.svg" alt="DWG Renamer">
        </div>
        <div class="app-name">DWG Renamer</div>
        <div class="app-desc">Automação</div>
      </div>

      <div class="app-card" onclick="openProjectManager()">
        <div class="app-icon">
          <img src="../../../assets/icons/project-manager.svg" alt="Project Manager">
        </div>
        <div class="app-name">Project Manager</div>
        <div class="app-desc">Automação</div>
      </div>
    </div>

  </div>
  <script src="renderer.js"></script>
</body>

</html>
