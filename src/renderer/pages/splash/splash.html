<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="splash" id="splash">
    <img src="../../../assets/icons/lato-infinite.png" alt="LatoApps">
  </div>

  <script>
    const splash = document.getElementById("splash");

    window.api.onSplashStartExit(() => {
      splash.classList.add("exit");
    });
  </script>
</body>

</html>
